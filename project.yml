name: SpeedRead
options:
  bundleIdPrefix: com.cami
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    PRODUCT_NAME: SpeedRead
    # Universal so the app runs on both Apple Silicon and Intel.
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      # Notarization requires the hardened runtime. No extra entitlements are
      # needed: CGEvent posting and the AX tree are gated by the runtime
      # Accessibility grant, not by entitlements.
      ENABLE_HARDENED_RUNTIME: YES
      # Overridden by CI / local signing env; adhoc keeps unsigned builds runnable.
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "-"

targets:
  SpeedRead:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cami.SpeedRead
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        LSMINIMUMSYSTEMVERSION: "$(MACOSX_DEPLOYMENT_TARGET)"
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
